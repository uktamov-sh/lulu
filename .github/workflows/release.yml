name: Release

# Builds LuLu for Windows from a `windows-vX.Y.Z` tag and publishes the
# installers on the Releases page, where LuLu's updater looks (update.rs).
#
# Signing: once SignPath Foundation has accepted the project, set the
# repository secret SIGNPATH_API_TOKEN and the variables SIGNPATH_ORGANIZATION_ID,
# SIGNPATH_PROJECT_SLUG and SIGNPATH_POLICY_SLUG. Until then the installers are
# published unsigned (Windows SmartScreen shows "More info → Run anyway").

on:
  push:
    tags:
      - 'windows-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNED: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: release-cargo-

      - name: Install dependencies
        run: npm ci

      # Three files carry the version and they drift silently: a "0.1.1" that
      # installs a 0.1.0 is noticed only when a bug report arrives.
      - name: Check the tag and every version agree
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        run: |
          $tag  = "${{ github.ref_name }}" -replace '^windows-v', ''
          $conf = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $pkg  = (Get-Content package.json | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"(.+)"').Matches[0].Groups[1].Value
          "tag=$tag tauri.conf=$conf package.json=$pkg Cargo.toml=$cargo"
          $bad = @()
          if ($tag -ne $conf)  { $bad += "tauri.conf.json says $conf" }
          if ($tag -ne $pkg)   { $bad += "package.json says $pkg" }
          if ($tag -ne $cargo) { $bad += "Cargo.toml says $cargo" }
          if ($bad) { throw "tag says $tag but $($bad -join '; ')" }

      # `npm run build` (tauri's beforeBuildCommand) builds lulu-hook first;
      # `pack` copies the installers out of target/ under their shipping names.
      - name: Build and pack the installers
        id: pack
        shell: pwsh
        run: |
          npm run pack
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          Get-ChildItem release | Format-Table Name, Length

      - name: Upload the unsigned installers
        id: unsigned
        uses: actions/upload-artifact@v7
        with:
          name: LuLu-Windows-unsigned
          path: |
            release/LuLu-Windows-${{ steps.pack.outputs.version }}-setup.exe
            release/LuLu-Windows-${{ steps.pack.outputs.version }}.msi
          retention-days: 7

      - name: Sign with SignPath
        if: env.SIGNED == 'true'
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.pack.outputs.version }}"
          $warn = if ($env:SIGNED -eq 'true') { "" } else {
            "`n`nThis build is not code-signed yet, so Windows SmartScreen shows a warning: click **More info → Run anyway**."
          }
          $notes = "LuLu for Windows $v — a panda at the top of your screen who watches your AI coding agents.`n`nDownload ``LuLu-Windows-$v-setup.exe`` (or the ``.msi``) and run it.$warn"
          gh release create "${{ github.ref_name }}" `
            "release/LuLu-Windows-$v-setup.exe" `
            "release/LuLu-Windows-$v.msi" `
            --title "LuLu for Windows $v" `
            --notes $notes
